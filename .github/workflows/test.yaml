name: Terraform CI-CD

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:

  # ============================================================
  # PLAN - Runs for Pull Request
  # ============================================================
  terraform-plan:

    if: github.event_name == 'pull_request'

    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # - name: Setup Terraform
      #   uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan


  # ============================================================
  # APPLY - Runs only after PR is merged into main
  # ============================================================
  terraform-apply:

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      # - name: Setup Terraform
      #   uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply
        run: terraform apply -auto-approve